<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="earth.css">
    <title>AstroNova_Group2</title>
</head>
<body>
    <div class="container">
    <header class="site-header">
  <nav class="navbar" aria-label="Main">
    <a href="/" class="logo"><img src="Images/Logo.png" alt="Planet home"></a>
    <button type="button" class="theme-toggle" aria-label="Switch to dark mode">
      <img src="Images/Path.png" alt="">
    </button>
  </nav>

  <search>
    <form action="#" class="search-form">
      <label for="search" class="visually-hidden">Search planet name</label>
      <img src="Images/SearchIcon.png" alt="">
      <input type="search" id="search" name="q" placeholder="Search planet name">
      <button type="submit">Search</button>
    </form>
  </search>
</header>

<main>
  <article class="planet-card">
    <img src="Images/Earth.png" alt="Earth">
    <h2>Earth</h2>
    <p class="planet-type">Terrestrial</p>
    <p>The only known planet to support life, with liquid water on its surface.</p>

    <dl class="stats">
      <div><dt>Gravity</dt><dd>9.8</dd></div>
      <div><dt>Mass</dt><dd>0.00315</dd></div>
      <div><dt>Period</dt><dd>365</dd></div>
    </dl>

    <ul class="details">
      <li><img src="Images/Temperature_Icon.png" alt=""><span class="visually-hidden">Temperature:</span> 288</li>
      <li><img src="Images/Half_moon.png" alt=""><span class="visually-hidden">Moons:</span> 1</li>
      <li><img src="Images/Diameter.png" alt=""><span class="visually-hidden">Diameter:</span> 12756</li>
      <li><img src="Images/CompanyIcon.png" alt=""><span class="visually-hidden">Distance from Sun:</span> 149.6</li>
    </ul>
  </article>
</main>
</div>   
</body>
</html>
