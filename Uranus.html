<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AstroNova_Group2</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Uranus Card -->
  <div class="planet-card">
    <div class="planet-image-container">
      <img src="https://anurella.github.io/images/planets/uranus.webp" alt="Uranus" class="planet-img">
    </div>
    <div class="planet-info">
      <h2>Uranus</h2>
      <span class="planet-type"><a href="ice-giants.html">Ice Giant</a></span>
      <p class="description">An ice giant that rotates on its side, giving it extreme seasonal cycles.</p>
      
      <div class="planet-metrics-box">
        <div class="metric-item">
          <span class="metric-label">Gravity</span>
          <span class="metric-value">8.7</span>
        </div>
        <div class="metric-item">
          <span class="metric-label">Mass</span>
          <span class="metric-value">0.0457</span>
        </div>
        <div class="metric-item">
          <span class="metric-label">Period</span>
          <span class="metric-value">30,687</span>
        </div>
      </div>

      <div class="planet-details-grid">
        <div class="detail-item">
          <img src="Vector.svg" alt="Vector" class="detail-icon-svg">
          <span class="detail-value">78</span>
        </div>
        <div class="detail-item">
          <img src="Path.svg" alt="Path" class="detail-icon-svg">
          <span class="detail-value">28</span>
        </div>
        <div class="detail-item">
          <img src="Shape.svg" alt="Shape" class="detail-icon-svg">
          <span class="detail-value">51118</span>
        </div>
        <div class="detail-item">
           <img src="Company Icon.svg" alt="Company Icon" class="detail-icon-svg">
          <span class="detail-value">2872.5</span>
        </div>
      </div>
    </div>
  </div> <!-- Closes Uranus planet-card -->

  <!-- Saturn Card -->
  <div class="planet-card">
    <div class="planet-image-container">
      <img src="https://anurella.github.io/images/planets/saturn.webp" alt="Saturn" class="planet-img">
    </div>
    <div class="planet-info">
      <h2>Saturn</h2>
      <span class="planet-type"><a href="Gas Giant.html">Gas Giant</a></span>
      <p class="description">Distinguished by its stunning ring system made of ice and rock.</p>
      
      <div class="planet-metrics-box">
        <div class="metric-item">
          <span class="metric-label">Gravity</span>
          <span class="metric-value">9.0</span>
        </div>
        <div class="metric-item">
          <span class="metric-label">Mass</span>
          <span class="metric-value">0.299</span>
        </div>
        <div class="metric-item">
          <span class="metric-label">Period</span>
          <span class="metric-value">10759</span>
        </div>
      </div>

      <div class="planet-details-grid">
        <div class="detail-item">
          <img src="Vector.svg" alt="Vector" class="detail-icon-svg">
          <span class="detail-value">133</span>
        </div>
        <div class="detail-item">
          <img src="Path.svg" alt="Path" class="detail-icon-svg">
          <span class="detail-value">146</span>
        </div>
        <div class="detail-item">
          <img src="Shape.svg" alt="Shape" class="detail-icon-svg">
          <span class="detail-value">120536</span>
        </div>
        <div class="detail-item">
          <img src="Company Icon.svg" alt="Company Icon" class="detail-icon-svg">
          <span class="detail-value">1433.5</span>
        </div>
      </div>
    </div>
  </div> <!-- Closes Saturn planet-card -->
</body>
</html>
