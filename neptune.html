<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="Utf-8">
        <meta name="viewport" content="width=device_width,initial scale=1.0">
    </head>
    <body>
        <div class="planet-card">

        <div class="planet-icon">
            <div class="Neptune"></div>
        </div>

        <div class="planet-content">

            <h1>Neptune</h1>

            <a href="#" class="planet-type">Ice Giant</a>

            <p class="description">
                An ice giant that rotates on its side, giving it
                extreme seasonal cycles.
            </p>

            <div class="planet-stats">

                <div class="stat">
                    <h3>GRAVITY</h3>
                    <p>11.0</p>
                </div>

                <div class="stat">
                    <h3>MASS</h3>
                    <p>0.0539</p>
                </div>

                <div class="stat">
                    <h3>PERIOD</h3>
                    <p>60190</p>
                </div>

            </div>

            <div class="planet-details">

                <div class="detail">
                    <span class="icon">🌡️</span>
                    <span>73</span>
                </div>

                <div class="detail">
                    <span class="icon">🌙</span>
                    <span>16</span>
                </div>

                <div class="detail">
                    <span class="icon">🌕</span>
                    <span>49528</span>
                </div>

                <div class="detail">
                    <span class="icon">☀️</span>
                    <span>4495.1</span>
                </div>

            </div>

        </div>

        </div>

    </body>
